[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These values are public by design, not credentials:
  #   SMTP_TO / SMTP_FROM / SMTP_USER / ADMIN_EMAIL: the contact address (the
  #     site shows it), which is also the fallback in src/lib/merge-additions.ts.
  #   VITE_* : Supabase URL and anon key, shipped to browsers by design.
  # SMTP_PASS, ADMIN_PASSWORD, DATABASE_URL and NETLIFY_PURGE_TOKEN stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_TO,SMTP_FROM,SMTP_USER,ADMIN_EMAIL,VITE_SITE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  # SPA fallback for client-side routes.
  source = "/*"
  destination = "/index.html"
  status = 200
  condition = {Path = "not:/*{.js,.css,.png,.jpg,.jpeg,.gif,.ico,.svg,.woff,.woff2,.pdf,.xml,.txt}"}

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Self-hosted fonts: file names carry a content hash (see src/fonts.css),
  # so they never change in place and can be cached for a year.
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
