[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # SMTP_TO is the public contact address, which the site shows anyway and which
  # is also the fallback in src/lib/merge-additions.ts. The scanner would
  # otherwise block every deploy on it. Real SMTP credentials are not omitted.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_TO"

[[redirects]]
  # SPA fallback for client-side routes.
  source = "/*"
  destination = "/index.html"
  status = 200
  condition = {Path = "not:/*{.js,.css,.png,.jpg,.jpeg,.gif,.ico,.svg,.woff,.woff2,.pdf,.xml,.txt}"}

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Self-hosted fonts: file names carry a content hash (see src/fonts.css),
  # so they never change in place and can be cached for a year.
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
